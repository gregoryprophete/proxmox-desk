name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds only the app code; generate the Windows runner.
      - name: Generate Windows project
        run: flutter create . --platforms=windows --project-name proxmox_desk

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: proxmox-desk-windows
          path: build/windows/x64/runner/Release/
